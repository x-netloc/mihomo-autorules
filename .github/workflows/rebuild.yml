name: Rebuild Mihomo rules

on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

env:
  AUTORULES_REPOSITORY: x-netloc/autorules
  AUTORULES_REF: main
  MIHOMO_REPOSITORY: MetaCubeX/mihomo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test adapter
        run: python3 -m unittest discover -s tests -v

      - name: Fetch autorules
        id: autorules
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$AUTORULES_REF" \
            "https://github.com/${AUTORULES_REPOSITORY}.git" canonical
          python3 canonical/scripts/validate.py --root canonical
          echo "commit=$(git -C canonical rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import os
          import tomllib

          with open("canonical/catalog.toml", "rb") as handle:
              upstream = tomllib.load(handle)["upstream"]

          values = {
              "upstream": upstream["repository"],
              "upstream_ref": upstream["ref"],
              "geosite_asset": upstream["geosite_asset"],
              "geoip_asset": upstream["geoip_asset"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  print(f"{key}={value}", file=output)
          PY

      - name: Resolve Mihomo release
        id: mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${MIHOMO_REPOSITORY}/releases/latest" \
            -o mihomo-release.json
          tag=$(jq -r '.tag_name' mihomo-release.json)
          asset_count=$(jq \
            '[.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$"))] | length' \
            mihomo-release.json)
          url=$(jq -r \
            '.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$")) | .browser_download_url' \
            mihomo-release.json)
          digest=$(jq -r \
            '.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$")) | .digest' \
            mihomo-release.json)
          if [ "$asset_count" -ne 1 ] || [ -z "$tag" ] || [ "$tag" = "null" ] || \
             [ -z "$url" ] || [ "$url" = "null" ] || [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Compatible Mihomo release asset not found." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream checksums
        id: source
        env:
          UPSTREAM: ${{ steps.autorules.outputs.upstream }}
          UPSTREAM_REF: ${{ steps.autorules.outputs.upstream_ref }}
          GEOSITE_ASSET: ${{ steps.autorules.outputs.geosite_asset }}
          GEOIP_ASSET: ${{ steps.autorules.outputs.geoip_asset }}
          AUTORULES_COMMIT: ${{ steps.autorules.outputs.commit }}
          MIHOMO_TAG: ${{ steps.mihomo.outputs.tag }}
          MIHOMO_DIGEST: ${{ steps.mihomo.outputs.digest }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${UPSTREAM}/${UPSTREAM_REF}"
          curl -fsSL "$base/${GEOSITE_ASSET}.sha256sum" -o upstream.geosite.sha256
          curl -fsSL "$base/${GEOIP_ASSET}.sha256sum" -o upstream.geoip.sha256

          upstream_digest=$(cat upstream.geosite.sha256 upstream.geoip.sha256 | sha256sum | awk '{print $1}')
          adapter_digest=$(sha256sum scripts/build.py .github/workflows/rebuild.yml | sha256sum | awk '{print $1}')
          combined=$(printf '%s\n%s\n%s\n%s\n%s\n' "$upstream_digest" "$AUTORULES_COMMIT" "$MIHOMO_TAG" "$MIHOMO_DIGEST" "$adapter_digest" | sha256sum | awk '{print $1}')
          echo "combined=$combined" >> "$GITHUB_OUTPUT"

      - name: Decide whether to rebuild
        id: check
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.combined }}
        run: |
          set -euo pipefail
          if [ -f .source.sha256 ] && [ "$(cat .source.sha256)" = "$SOURCE_DIGEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Sources unchanged, skipping rebuild."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install v2dat
        if: steps.check.outputs.skip != 'true'
        run: go install github.com/urlesistiana/v2dat@latest

      - name: Download upstream data
        if: steps.check.outputs.skip != 'true'
        env:
          UPSTREAM: ${{ steps.autorules.outputs.upstream }}
          UPSTREAM_REF: ${{ steps.autorules.outputs.upstream_ref }}
          GEOSITE_ASSET: ${{ steps.autorules.outputs.geosite_asset }}
          GEOIP_ASSET: ${{ steps.autorules.outputs.geoip_asset }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${UPSTREAM}/${UPSTREAM_REF}"
          curl -fsSL "$base/$GEOSITE_ASSET" -o "$GEOSITE_ASSET"
          curl -fsSL "$base/$GEOIP_ASSET" -o "$GEOIP_ASSET"
          sha256sum -c upstream.geosite.sha256
          sha256sum -c upstream.geoip.sha256

      - name: Unpack via v2dat
        if: steps.check.outputs.skip != 'true'
        env:
          GEOSITE_ASSET: ${{ steps.autorules.outputs.geosite_asset }}
          GEOIP_ASSET: ${{ steps.autorules.outputs.geoip_asset }}
        run: |
          set -euo pipefail
          mkdir -p unpacked/geosite unpacked/geoip
          v2dat unpack geosite -o unpacked/geosite "$GEOSITE_ASSET"
          v2dat unpack geoip -o unpacked/geoip "$GEOIP_ASSET"

      - name: Download Mihomo
        if: steps.check.outputs.skip != 'true'
        env:
          MIHOMO_URL: ${{ steps.mihomo.outputs.url }}
          MIHOMO_DIGEST: ${{ steps.mihomo.outputs.digest }}
        run: |
          set -euo pipefail
          curl -fsSL "$MIHOMO_URL" -o mihomo.gz
          echo "${MIHOMO_DIGEST#sha256:}  mihomo.gz" | sha256sum -c -
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Prepare providers and overrides
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 scripts/build.py \
            --catalog canonical/catalog.toml \
            --profiles canonical/profiles \
            --geosite-in unpacked/geosite \
            --geoip-in unpacked/geoip \
            --out build \
            --repository "${{ github.repository }}"

      - name: Compile native MRS providers
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/geosite build/geoip
          for source in build/staging/geosite/*.txt; do
            name="$(basename "$source" .txt)"
            ./mihomo convert-ruleset domain text "$source" "build/geosite/$name.mrs"
          done
          for source in build/staging/geoip/*.txt; do
            name="$(basename "$source" .txt)"
            ./mihomo convert-ruleset ipcidr text "$source" "build/geoip/$name.mrs"
          done
          rm -rf build/staging
          for override in build/profiles/*.js; do
            node --check "$override"
          done
          expected_geosite=$(jq '[.categories.geosite[] | select(.domain > 0)] | length' build/.build-manifest.json)
          expected_geoip=$(jq '[.categories.geoip[] | select(.cidr > 0)] | length' build/.build-manifest.json)
          test "$(find build/geosite -name '*.mrs' | wc -l)" -eq "$expected_geosite"
          test "$(find build/geoip -name '*.mrs' | wc -l)" -eq "$expected_geoip"

      - name: Force-push output to dist branch
        if: steps.check.outputs.skip != 'true'
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.combined }}
          AUTORULES_COMMIT: ${{ steps.autorules.outputs.commit }}
          MIHOMO_TAG: ${{ steps.mihomo.outputs.tag }}
          MIHOMO_DIGEST: ${{ steps.mihomo.outputs.digest }}
        run: |
          set -euo pipefail
          echo "$SOURCE_DIGEST" > build/.source.sha256
          echo "$AUTORULES_COMMIT" > build/.autorules.commit
          echo "$MIHOMO_TAG" > build/.mihomo.version
          echo "$MIHOMO_DIGEST" > build/.mihomo.sha256
          work="$(mktemp -d)"
          cp -r build/. "$work/"
          cd "$work"
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add .
          git commit -q -m "dist: source $SOURCE_DIGEST"
          git push -q --force origin dist

      - name: Update source marker on main
        if: steps.check.outputs.skip != 'true'
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.combined }}
          AUTORULES_COMMIT: ${{ steps.autorules.outputs.commit }}
        run: |
          set -euo pipefail
          echo "$SOURCE_DIGEST" > .source.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source.sha256
          if git diff --cached --quiet; then
            echo "No marker change."
          else
            git commit -q -m "build: autorules ${AUTORULES_COMMIT:0:12}"
            git push -q
          fi
